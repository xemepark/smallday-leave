<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6f1">
<title>小日子劃假系統（Firestore 版）</title>
<style>
  :root{
    --bg:#faf6f1; --card:#fff; --ink:#3b2f2a; --sub:#8a7b72; --line:#ece3da;
    --leave:#c8553d; --leave-bg:#fbe9e4; --mgr:#4a7fb5; --mgr-bg:#e6effa;
    --other:#b8892c; --other-bg:#faf1dc; --ok:#4f8a5b; --ok-bg:#e8f3ea;
    --full:#b3a79f; --full-bg:#f1ece7; --sat:#4a7fb5; --sun:#c8553d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    font-size:15px;line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px calc(32px + env(safe-area-inset-bottom))}
  .hidden{display:none!important}
  .brand{font-size:13px;letter-spacing:.15em;color:var(--sub)}
  h1{font-size:22px;margin:2px 0 0;font-weight:700}

  /* 登入 */
  #login{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
  #login p{color:var(--sub);margin:0}
  #loginMsg{color:var(--leave);font-size:14px;min-height:1.5em}

  /* 頂部 */
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
  .who{text-align:right;font-size:13px;color:var(--sub)}
  .who b{display:block;color:var(--ink);font-size:15px}
  .link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:12px;padding:0;cursor:pointer}

  .menu{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .menu a{flex:none;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap}
  .menu a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .status{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
  .status.open{background:var(--ok-bg);color:var(--ok)}
  .status.before,.status.unset{background:var(--other-bg);color:var(--other)}
  .status.closed,.status.paused{background:var(--full-bg);color:var(--sub)}

  .counts{display:flex;gap:8px;margin-bottom:10px}
  .count{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .count small{color:var(--sub);font-size:12px;display:block}
  .count b{font-size:20px}
  .count span{color:var(--sub);font-size:13px}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);margin:4px 2px 8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

  /* 月曆 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
  .dow.sat{color:var(--sat)} .dow.sun{color:var(--sun)}
  .day{aspect-ratio:1/1.1;border-radius:10px;border:1px solid var(--line);background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font:inherit;color:inherit;padding:0;cursor:pointer;position:relative}
  .day .n{font-size:15px;font-weight:600}
  .day.sat .n{color:var(--sat)} .day.sun .n{color:var(--sun)}
  .day .t{font-size:11px;line-height:1}
  .day.open .t{color:var(--ok)}
  .day.full{background:var(--full-bg)} .day.full .t{color:var(--full)}
  .day.blocked{background:var(--full-bg)} .day.blocked .t{color:var(--leave);font-weight:700}
  .day.na .t{color:var(--full)}
  .day.mine-leave{background:var(--leave);border-color:var(--leave)}
  .day.mine-leave .n,.day.mine-leave .t{color:#fff}
  .day.mine-mgr{background:var(--mgr-bg);border-color:var(--mgr)} .day.mine-mgr .t{color:var(--mgr);font-weight:700}
  .day.holiday{background:#eaf3ec;border-color:#4f8a5b} .day.holiday .t{color:#4f8a5b;font-weight:700}
  .day.mine-other{background:var(--other-bg);border-color:var(--other)} .day.mine-other .t{color:var(--other);font-weight:700}
  .day.mine-wish{background:#ffe27a;border:2px solid #e3b000} .day.mine-wish .n{color:#5c4300} .day.mine-wish .t{color:#7a5900;font-weight:700}
  .day.mine-apply{background:#fff;border:2px dashed var(--other)} .day.mine-apply .t{color:var(--other);font-weight:700;font-size:11px}
  .row.mine-wish{border:2px solid #e3b000} .row.mine-wish .b{background:#ffe27a;color:#7a5900}
  .row.mine-apply{border:2px dashed var(--other)} .row.mine-apply .b{color:var(--other)}
  .turnbox{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;background:var(--mgr-bg);color:var(--mgr)}
  .turnbox.go{background:var(--ok-bg);color:var(--ok);font-weight:700}
  .turnbox.done{background:var(--full-bg);color:var(--sub)}
  .turnbox ol{margin:6px 0 0;padding-left:22px;font-weight:400;color:var(--sub)}
  .turnbox ol li.turn{color:var(--ok);font-weight:700} .turnbox ol li.me{text-decoration:underline}
  .opts{display:flex;gap:6px;margin-top:8px}
  .opts button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
  .opts button.wish{border-color:#e3b000;color:#7a5900;background:#fff6d1}
  .opts button.kind{color:var(--other);border-color:var(--other)}
  .opts button.off{background:var(--full-bg);color:var(--sub);border-color:var(--line)}
  .submitbox{margin:14px 0 6px}
  .submitbox .streak{background:var(--leave-bg);color:var(--leave);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px}
  #alertBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:60;padding:20px}
  #alertBox.show{display:flex}
  #alertBox .in{background:var(--card);border-radius:16px;padding:18px;max-width:420px;width:100%}
  #alertBox h3{margin:0 0 8px;font-size:17px} #alertBox p{white-space:pre-line;margin:0 0 14px;font-size:15px;line-height:1.6}
  .day.sel{outline:2px solid var(--ink);outline-offset:1px}
  .blank{visibility:hidden}

  /* 月曆／清單切換 */
  .viewsw{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 10px}
  .viewsw button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font:inherit;font-weight:700;color:var(--sub);cursor:pointer}
  .viewsw button.on{background:var(--ink);color:#fff}
  /* 清單模式 */
  .lopt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:0 2px 8px}
  .list{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .row .d{min-width:86px;font-weight:700}
  .row.sat .d{color:var(--sat)} .row.sun .d{color:var(--sun)}
  .row .b{font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px}
  .row .m{flex:1;text-align:right;font-size:12px;color:var(--sub)}
  .row.open .b{background:var(--ok-bg);color:var(--ok)}
  .row.full,.row.blocked{background:var(--full-bg)} .row.full .b{color:var(--full)} .row.blocked .b{color:var(--leave)}
  .row.na .b{color:var(--full)}
  .row.mine-leave{border-color:var(--leave)} .row.mine-leave .b{background:var(--leave);color:#fff}
  .row.mine-mgr{border-color:var(--mgr)} .row.mine-mgr .b{background:var(--mgr-bg);color:var(--mgr);border:1px solid var(--mgr)}
  .row.mine-other{border-color:var(--other)} .row.mine-other .b{background:var(--other-bg);color:var(--other)}
  .row.holiday{background:#eaf3ec;border-color:#4f8a5b} .row.holiday .b{color:#4f8a5b}
  .row.sel{outline:2px solid var(--ink);outline-offset:1px}
  .list .none{color:var(--sub);font-size:14px;text-align:center;padding:16px 0}

  .warns{margin-top:14px;background:var(--other-bg);border-radius:12px;padding:10px 12px;font-size:13px;color:#7a5a17}
  .warns b{display:block;margin-bottom:4px}
  .warns ul{margin:0;padding-left:18px}
  footer{margin-top:18px;text-align:center;font-size:11px;color:var(--sub)}

  /* 底部面板 */
  #backdrop{position:fixed;inset:0;background:rgba(40,30,25,.35);opacity:0;pointer-events:none;transition:opacity .2s}
  #backdrop.show{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
    transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -6px 24px rgba(0,0,0,.08)}
  #sheet.show{transform:none}
  #sheet h2{margin:0;font-size:19px}
  #sheet .meta{color:var(--sub);font-size:13px;margin:2px 0 10px}
  #sheet .note{background:var(--leave-bg);color:var(--leave);border-radius:8px;padding:6px 10px;font-size:13px;margin-bottom:10px}
  .people{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .people li{background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px}
  .people li em{font-style:normal;font-size:11px;margin-left:4px;color:var(--sub)}
  .people .empty{background:none;color:var(--sub);padding:0}
  .btn{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .btn.primary{background:var(--leave);color:#fff}
  .btn.danger{background:var(--card);color:var(--leave);border:1.5px solid var(--leave)}
  .btn.danger.confirm{background:var(--leave);color:#fff}
  .btn:disabled{background:var(--full-bg);color:var(--sub);cursor:default}
  .btn.off{background:var(--full-bg);color:var(--sub)}
  .hint{font-size:13px;color:var(--sub);text-align:center;margin-top:8px}

  #toast{position:fixed;left:50%;top:14px;transform:translate(-50%,calc(-100% - 30px));background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw;transition:transform .25s;z-index:20}
  #toast.show{transform:translate(-50%,0)}
  #toast.err{background:var(--leave)}
  #busy{position:fixed;inset:0;background:rgba(250,246,241,.6);display:flex;align-items:center;justify-content:center;z-index:15}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--leave);border-radius:50%;animation:s 0.8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
<script>/* 有新版就自動換成新版（避免手機一直顯示舊畫面） */(function(){var b='B20261128e';try{fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var m=t.match(/var b='(B[0-9a-z]+)'/);if(m&&m[1]!==b&&!sessionStorage.getItem('rl'+m[1])){sessionStorage.setItem('rl'+m[1],'1');location.replace(location.pathname+'?v='+m[1]+location.hash);}}).catch(function(){});}catch(e){}})();</script>
</head>
<body>

<div class="wrap">
  <section id="login">
    <div class="brand">SMALLDAY PHOTOGRAPHY</div>
    <h1>小日子劃假系統</h1>
    <p>請用你登記在公司的 Google 帳號登入</p>
    <div id="gbtn"></div>
    <div id="loginMsg"></div>
  </section>

  <section id="app" class="hidden">
    <header>
      <div>
        <div class="brand">小日子劃假系統</div>
        <h1 id="monthTitle"></h1>
      </div>
      <div class="who"><b id="whoName"></b><span id="whoRole"></span><br><button class="link" id="logoutBtn">登出</button></div>
    </header>

    <nav class="menu hidden" id="menu"></nav>

    <div class="tabs hidden" id="monthTabs"></div>

    <div id="status" class="status"></div>
    <div id="turnBox" class="turnbox hidden"></div>

    <div class="counts">
      <div class="count"><small id="cLeaveLabel">自排</small><b id="cLeave">0</b><span id="cLeaveMax"></span></div>
      <div class="count" id="cWishBox"><small>許願（主管決定）</small><b id="cWish">0</b><span id="cWishMax"></span><small id="cWishMgr" class="hidden" style="display:block;margin-top:4px;color:var(--mgr)"></small></div>
      <div class="count" id="cWeekendBox"><small>週六日自選</small><b id="cWeekend">0</b><span id="cWeekendMax"></span></div>
    </div>

    <div class="legend">
      <span><i style="background:var(--leave)"></i>我的排休</span>
      <span><i style="background:var(--mgr-bg);border:1px solid var(--mgr)"></i>公排</span>
      <span><i style="background:#ffe27a;border:1px solid #e3b000"></i>許願</span>
      <span><i style="background:#fff;border:1.5px dashed var(--other)"></i>請假待審</span>
      <span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>還有名額</span>
      <span><i style="background:var(--full-bg)"></i>額滿／禁休</span>
      <span><i style="background:#eaf3ec;border:1px solid #4f8a5b"></i>公司公休</span>
    </div>

    <div class="viewsw" id="viewSw"><button data-v="cal">📅 月曆</button><button data-v="list">📋 清單</button></div>
    <div class="cal" id="cal"></div>
    <div id="listWrap" class="hidden">
      <label class="lopt"><input type="checkbox" id="onlyMine"> 只看我的排休</label>
      <div class="list" id="list"></div>
    </div>

    <div class="warns hidden" id="warns"><b>提醒</b><ul id="warnList"></ul></div>

    <div class="submitbox hidden" id="submitBox">
      <div class="streak hidden" id="streakBox"></div>
      <button class="btn primary" id="submitBtn">送出</button>
      <div class="hint" id="submitHint"></div>
    </div>

    <footer id="foot"></footer>
  </section>
</div>

<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <h2 id="sTitle"></h2>
  <div class="meta" id="sMeta"></div>
  <div class="note hidden" id="sNote"></div>
  <ul class="people" id="sPeople"></ul>
  <button class="btn" id="sBtn"></button>
  <div class="opts" id="sOpts"></div>
  <div class="hint" id="sHint"></div>
</div>
<div id="alertBox" role="alertdialog" aria-modal="true"><div class="in"><h3 id="alertTitle"></h3><p id="alertMsg"></p><button class="btn primary" id="alertOk">知道了</button></div></div>

<div id="toast"></div>
<div id="busy" class="hidden"><div class="spin"></div></div>

<script>
/* ===== 部署前要填的兩個值 ===== */
const CONFIG = {
  API_URL:   'https://script.google.com/macros/s/AKfycbwSHhNQ1JqDzJ3GZr0eGOs1pAAh8QProNN2W0u5A3xTBNKiZn-fn3qsq2_pF6KAC-K4AA/exec',
  CLIENT_ID: '780487399205-t8rnesc1nh8d3f58vdtglslai5ui6l0t.apps.googleusercontent.com'
};
const VERSION = '2.4.0';
const POLL_MS = 5000;    // 自動更新間隔；資料沒變時後端只回「沒變」，很快
const WEEK = '日一二三四五六';

const $ = s => document.querySelector(s);
const state = { token: null, me: null, data: null, month: null, sel: null, busy: false, confirmCancel: false, timer: null };

const store = {
  get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} },
  del(k){ try { sessionStorage.removeItem(k); } catch(e){} }
};

/* ===== 登入 ===== */
function onGsiLoad(){
  if (CONFIG.CLIENT_ID.indexOf('請填入') === 0) { showLogin('網頁還沒設定 CLIENT_ID，請洽管理員'); return; }
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: r => setToken(r.credential),
    auto_select: true,
    cancel_on_tap_outside: false
  });
  google.accounts.id.renderButton($('#gbtn'), { theme:'outline', size:'large', shape:'pill', text:'signin_with', locale:'zh-TW', width:260 });
  const saved = store.get('token');
  if (saved && !tokenExpired(saved)) setToken(saved);
  else { showLogin(''); google.accounts.id.prompt(); }
}

function tokenExpired(t){
  try {
    const p = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return p.exp * 1000 < Date.now() + 60000;
  } catch(e){ return true; }
}

function setToken(t){
  state.token = t;
  store.set('token', t);
  start();
}

/** 先確認身分：同仁進劃假頁；只有管理權限的人直接進管理後台 */
async function start(){
  setBusy(true);
  try {
    // 確認身分和讀月曆同時進行，不用一個等一個
    const pLoad = api('load', { month: state.month }); pLoad.catch(() => {});
    state.me = await api('whoami');
    if (!state.me.staff){ location.replace('admin.html#quota'); return; }
    setBusy(false);
    await load(true, pLoad);
    renderMenu('leave');
    checkDispatch('leave');
  } catch(e){ handleError(e); }
  finally { setBusy(false); }
}

/* ===== 依角色顯示的選單（員工頁、管理後台共用同一份） ===== */
const NAV = [
  { id: 'leave',    label: '我的劃假', href: 'index.html',         show: me => me.staff },
  { id: 'roster',   label: '排休總表', href: 'admin.html#roster',   show: me => me.admin },
  { id: 'dispatch', label: '派工',     href: '../dispatch.html',       show: me => me.admin },
  { id: 'quota',    label: '名額設定', href: 'admin.html#quota',    show: me => me.admin },
  { id: 'rules',    label: '職務名額', href: 'admin.html#rules',    show: me => me.admin },
  { id: 'settings', label: '系統設定', href: 'admin.html#settings', show: me => me.admin },
  { id: 'admins',   label: '管理員',   href: 'admin.html#admins',   show: me => me.owner },
  { id: 'dperm',    label: '派工權限', href: 'admin.html#dperm',    show: me => me.admin },
  { id: 'schedule', label: '班表',     href: '../dispatch.html',       show: me => !me.admin && !!me.dispatchRole }
];
// 不是管理員的人，問派工系統有沒有開放看班表；有的話選單多一個「班表」
const DISPATCH_API = 'https://script.google.com/macros/s/AKfycbwabey942q1fUpPhaeaFng1AD1jsBWvddG8vOhEJ1AhImsW9vnN8wOVJBk7T5W3zVoR_g/exec';
async function checkDispatch(active){
  if (!state.me || state.me.admin) return;
  try {
    const r = await (await fetch(DISPATCH_API, { method:'POST', body: JSON.stringify({ action:'ping', idToken: state.token }) })).json();
    if (r.ok && r.role && state.me) { state.me.dispatchRole = r.role; renderMenu(active); }
  } catch(e){}
}
function renderMenu(active){
  const m = $('#menu'); if (!m || !state.me) return;
  const items = NAV.filter(n => n.show(state.me));
  m.textContent = '';
  m.classList.toggle('hidden', items.length < 2);
  items.forEach(n => { const a = el('a', n.id === active ? 'on' : '', n.label); a.href = n.href; m.appendChild(a); });
}


function showLogin(msg){
  stopPoll();
  closeSheet();
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginMsg').textContent = msg || '';
}

function logout(msg){
  state.token = null; state.data = null; state.me = null;
  store.del('token');
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  showLogin(msg);
}

/* ===== API ===== */
async function api(action, extra){
  const body = JSON.stringify(Object.assign({ action, idToken: state.token }, extra || {}));
  let data;
  try {
    const res = await fetch(CONFIG.API_URL, { method:'POST', body }); // text/plain，避免 CORS 預檢
    data = await res.json();
  } catch(e){
    const err = new Error('連線失敗，請檢查網路後再試'); err.code = 'NETWORK'; throw err;
  }
  if (!data.ok){ const err = new Error(data.error || '發生錯誤'); err.code = data.code; throw err; }
  return data;
}

function handleError(e){
  if (e.code === 'AUTH') { logout(e.message); if (window.google) google.accounts.id.prompt(); return; }
  if (e.code === 'NOT_STAFF' || e.code === 'SETUP') { logout(e.message); return; }
  toast(e.message, true);
}

async function load(first, pre){
  if (first) setBusy(true);
  try {
    // 自動更新時帶上目前資料的版本；後端資料沒變就回 same，不用重畫
    const extra = { month: state.month };
    const poll = !first && !pre && state.data && state.data.month === state.month && state.ver;
    if (poll && (state.polls = (state.polls || 0) + 1) % 4 !== 0) extra.since = state.ver;
    const d = await (pre || api('load', extra));
    if (d.same) return;
    state.ver = d.ver || null;
    render(d);
    if (first) startPoll();
  } catch(e){ handleError(e); }
  finally { if (first) setBusy(false); }
}

async function act(action, date, type){
  if (state.busy) return;
  setBusy(true);
  try {
    const data = await api(action, type ? { date, type } : { date });
    render(data);
    toast(data.message || '完成');
    closeSheet();
  } catch(e){
    if (e.code === 'WORK_STREAK') { closeSheet(); showAlert('這天不能排：會連續上班 7 天以上', e.message); }
    else handleError(e);
    if (state.token && e.code !== 'AUTH') load(false); // 失敗就立刻更新名額
  } finally { setBusy(false); }
}

function startPoll(){
  stopPoll();
  state.timer = setInterval(() => { if (!document.hidden && !state.busy && state.token) load(false); }, POLL_MS);
}
function stopPoll(){ if (state.timer) clearInterval(state.timer); state.timer = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.token && state.data) load(false); });

/* ===== 畫面 ===== */
function render(d){
  if (state.sel && state.data && d.month !== state.data.month) closeSheet();
  state.data = d;
  state.month = d.month;
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');

  const [y, m] = d.month.split('-');
  $('#monthTitle').textContent = y + ' 年 ' + Number(m) + ' 月';
  $('#whoName').textContent = d.me.name;
  $('#whoRole').textContent = d.me.store + '・' + d.me.role;

  const tabs = $('#monthTabs');
  tabs.classList.toggle('hidden', !(d.months && d.months.length > 1));
  tabs.textContent = '';
  (d.months || []).forEach(mo => {
    const b = el('button', 'tab' + (mo === d.month ? ' on' : ''), Number(mo.slice(5)) + ' 月');
    b.onclick = () => { if (mo !== state.month && !state.busy){ state.month = mo; closeSheet(); load(true); } };
    tabs.appendChild(b);
  });

  const st = $('#status');
  st.className = 'status ' + d.window.status;
  st.textContent = {
    open:   d.window.mode === '開放' ? '開放劃假中' : '開放劃假中・' + d.window.closeAt + ' 截止',
    paused: '目前暫停劃假，請等管理員開放（可以先看名額）',
    before: '尚未開放・' + d.window.openAt + ' 開始劃假',
    closed: '劃假已截止（' + d.window.closeAt + '），要調整請找人換班並經主管同意',
    unset:  '主管還沒設定劃假時間'
  }[d.window.status];

  $('#cLeaveLabel').textContent = Number(m) + ' 月自排';
  $('#cWishBox').classList.toggle('hidden', !d.limits.maxMgr);
  const mgrN = d.counts.mgr || 0;
  $('#cWish').textContent = d.counts.wishPending || 0;
  $('#cWishMax').textContent = ' / ' + Math.max(0, d.limits.maxMgr - mgrN) + ' 天';
  $('#cWishMgr').textContent = mgrN ? '主管已排公排 ' + mgrN + ' 天' : '';
  $('#cWishMgr').classList.toggle('hidden', !mgrN);
  renderTurn(d);
  $('#cLeave').textContent = d.counts.leave;
  $('#cLeaveMax').textContent = ' / ' + d.limits.maxLeave + ' 天';
  $('#cWeekendBox').classList.toggle('hidden', !d.limits.weekendCapped);
  $('#cWeekend').textContent = d.counts.weekend;
  $('#cWeekendMax').textContent = ' / ' + d.limits.maxWeekend + ' 天';

  const cal = $('#cal');
  cal.textContent = '';
  for (let i = 0; i < 7; i++){
    const h = el('div', 'dow' + (i === 6 ? ' sat' : i === 0 ? ' sun' : ''), WEEK[i]);
    cal.appendChild(h);
  }
  for (let i = 0; i < d.days[0].dow; i++) cal.appendChild(el('div', 'day blank'));
  d.days.forEach(day => {
    const info = dayState(day);
    const b = el('button', 'day ' + info.cls + (day.dow === 6 ? ' sat' : day.dow === 0 ? ' sun' : '') + (state.sel === day.date ? ' sel' : ''));
    b.appendChild(el('span', 'n', String(Number(day.date.slice(8)))));
    b.appendChild(el('span', 't', info.text));
    b.addEventListener('click', () => openSheet(day.date));
    cal.appendChild(b);
  });

  renderList(d);

  const warns = d.warnings || [];
  $('#warns').classList.toggle('hidden', !warns.length);
  const ul = $('#warnList'); ul.textContent = '';
  warns.forEach(w => ul.appendChild(el('li', '', w)));

  renderSubmit(d);
  $('#foot').textContent = '網頁 v' + VERSION + '・後端 v' + d.version + '・更新於 ' + d.serverTime.slice(11, 19);

  if (state.sel) fillSheet(state.sel);
}

/* ===== 清單模式 ===== */
function renderList(d){
  const v = state.view || 'cal';
  document.querySelectorAll('#viewSw button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#cal').classList.toggle('hidden', v !== 'cal');
  $('#listWrap').classList.toggle('hidden', v !== 'list');
  $('.legend').classList.toggle('hidden', v !== 'cal');
  if (v !== 'list') return;
  const only = $('#onlyMine').checked;
  const box = $('#list'); box.textContent = '';
  const days = d.days.filter(day => !only || day.mine || day.holiday);
  days.forEach(day => {
    const info = dayState(day);
    const r = el('button', 'row ' + info.cls + (day.dow === 6 ? ' sat' : day.dow === 0 ? ' sun' : '') + (state.sel === day.date ? ' sel' : ''));
    r.appendChild(el('span', 'd', Number(day.date.slice(5, 7)) + '/' + Number(day.date.slice(8)) + '（' + WEEK[day.dow] + '）'));
    r.appendChild(el('span', 'b', info.cls === 'blocked' ? '禁休' : info.text));
    const meta = day.holiday ? day.holiday : day.note ? day.note : (day.used ? '已排 ' + day.used + ' 人' : '');
    r.appendChild(el('span', 'm', meta));
    r.addEventListener('click', () => openSheet(day.date));
    box.appendChild(r);
  });
  if (!days.length) box.appendChild(el('div', 'none', '這個月還沒有排休'));
}

function dayState(day){
  if (day.holiday) return { cls: 'holiday', text: '公休' };
  if (day.mine === '自排') return { cls: 'mine-leave', text: day.mineBy === 'admin' ? '自排(主管)' : '自排' };
  if (day.mine === '公排') return { cls: 'mine-mgr', text: '公排' };
  if (day.mine === '許願') return { cls: 'mine-wish', text: '許願' };
  if (day.mine && /申請$/.test(day.mine)) return { cls: 'mine-apply', text: day.mine.replace('申請', '待審') };
  if (day.mine) return { cls: 'mine-other', text: day.mine };
  if (day.unlimited) return { cls: 'open', text: '可排' };
  if (day.quota === null) return { cls: 'na', text: '—' };
  if (day.quota <= 0) return { cls: 'blocked', text: '禁' };
  if (day.used >= day.quota) return { cls: 'full', text: '額滿' };
  return { cls: 'open', text: '剩 ' + (day.quota - day.used) };
}

/* ===== 底部面板 ===== */
function openSheet(date){
  state.sel = date;
  state.confirmCancel = false;
  fillSheet(date);
  document.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel'));
  render(state.data);
  $('#backdrop').classList.add('show');
  $('#sheet').classList.add('show');
}

function closeSheet(){
  state.sel = null;
  state.confirmCancel = false;
  $('#backdrop').classList.remove('show');
  $('#sheet').classList.remove('show');
  document.querySelectorAll('.day.sel').forEach(x => x.classList.remove('sel'));
}

function fillSheet(date){
  const d = state.data;
  const day = d.days.find(x => x.date === date);
  if (!day) return;
  const md = Number(date.slice(5, 7)) + '/' + Number(date.slice(8));
  $('#sTitle').textContent = md + '（' + WEEK[day.dow] + '）';
  $('#sMeta').textContent = day.holiday ? '全公司公休・' + day.holiday
    : day.unlimited ? d.me.role + '・不限人數，這天已有 ' + day.used + ' 人排休'
    : day.quota === null
    ? '這天沒有設定' + d.me.role + '的名額'
    : d.me.role + '・' + day.scope + '・名額 ' + day.quota + ' 人，已排 ' + day.used + ' 人';
  $('#sNote').classList.toggle('hidden', !day.note);
  $('#sNote').textContent = day.note;

  const ul = $('#sPeople'); ul.textContent = '';
  if (!day.people.length) ul.appendChild(el('li', 'empty', '目前還沒有人排休'));
  day.people.forEach(p => {
    const li = el('li', '', p.name);
    li.appendChild(el('em', '', p.store + '・' + p.type));
    ul.appendChild(li);
  });

  const btn = $('#sBtn'), hint = $('#sHint'), opts = $('#sOpts');
  const isWeekend = day.dow === 0 || day.dow === 6;
  btn.className = 'btn'; btn.disabled = false; hint.textContent = ''; btn.onclick = null;
  opts.textContent = ''; btn.classList.remove('hidden');
  const tv = d.turn || {};
  const locked = tv.submitted ? '你這個月已經送出了，要修改請洽主管' : (tv.active && !tv.isMyTurn ? '還沒輪到你（目前輪到 ' + tv.turnName + '），事假／病假／特休可以先申請' : '');
  const open = d.window.status === 'open';
  const hasRoom = day.unlimited || (day.quota !== null && day.quota > 0 && day.used < day.quota);
  // 下面一排：許願、事假、病假、特休
  const addOpt = (label, cls, why, fn) => {
    const o = el('button', cls + (why ? ' off' : ''), label);
    o.onclick = () => { if (why){ hint.textContent = why; return; } fn(); };
    opts.appendChild(o);
  };
  const showOpts = () => {
    if (d.limits.maxMgr){
      const why = !open ? '目前不能劃假' : locked || (!hasRoom ? '這天沒有名額' : (d.counts.wish >= d.limits.maxMgr ? ((d.counts.mgr || 0) ? '許願加公排已滿 ' + d.limits.maxMgr + ' 天' : '許願 ' + d.limits.maxMgr + ' 天已經滿了') : ''));
      addOpt('許願', 'wish', why, () => act('book', date, '許願'));
    }
    (d.kinds || []).forEach(k => {
      const why = !open ? '目前不能申請' : (!hasRoom ? '這天沒有名額' : '');
      addOpt(k, 'kind', why, () => act('book', date, k));
    });
  };

  // 不能劃的時候按鈕還是可以按，按了就關掉面板回到月曆
  const disable = (label, why) => { btn.textContent = label; btn.className = 'btn off'; btn.onclick = closeSheet; hint.textContent = why || ''; };

  if (day.holiday) return disable('全公司公休', '這天大家統一放假（' + day.holiday + '），不用劃，也不佔自排');
  if (day.mine === '自排' && day.mineBy === 'admin') return disable('已排休', '這天是主管幫你排的，要調整請洽主管');
  const canCancelMine = day.mine === '自排' || (day.mine === '許願' && day.mineBy !== 'admin') || (/申請$/.test(day.mine || '') && day.mineBy !== 'admin');
  if (canCancelMine && !/申請$/.test(day.mine) && locked) return disable('取消這天', locked);
  if (canCancelMine){
    const what = day.mine === '自排' ? '排休' : day.mine === '許願' ? '許願' : day.mine.replace('申請', '申請');
    if (d.window.status === 'paused') return disable('取消這天', '目前暫停劃假，請等管理員開放');
    if (d.window.status !== 'open') return disable('取消這天', '不在劃假時間，要調整請找人換班並經主管同意');
    btn.className = 'btn danger' + (state.confirmCancel ? ' confirm' : '');
    btn.textContent = state.confirmCancel ? '確定取消這天？' : '取消這天' + what;
    if (/申請$/.test(day.mine)) hint.textContent = '等主管放行中，放行前可以自己取消';
    if (day.mine === '許願') hint.textContent = '主管會依實際狀況決定給不給；決定前可以自己取消';
    btn.onclick = () => {
      if (!state.confirmCancel){ state.confirmCancel = true; fillSheet(date); return; }
      act('cancel', date);
    };
    return;
  }
  if (day.mine) return disable('已排' + day.mine, day.mine === '公排' ? '這天是公排（主管核准或安排的），要調整請洽主管' : '這天主管已經放行，要調整請洽主管');
  if (d.window.status === 'paused') return disable('劃這天排休', '目前暫停劃假，請等管理員開放');
  if (d.window.status !== 'open') return disable('劃這天排休', '目前不在劃假時間');
  if (!day.unlimited){
    if (day.quota === null) return disable('劃這天排休', '請洽主管設定名額');
    if (day.quota <= 0) return disable('這天禁休', day.note);
    if (day.used >= day.quota) return disable('名額已滿', '可以跟已排休的同事協調看看');
  }
  showOpts();
  if (locked) return disable('劃這天排休', locked);
  if (d.counts.leave >= d.limits.maxLeave) return disable('劃這天排休', '自排 ' + d.limits.maxLeave + ' 天已經劃滿' + (d.limits.maxMgr ? '，可以按下面「許願」' : ''));
  if (isWeekend && d.limits.weekendCapped && d.counts.weekend >= d.limits.maxWeekend)
    return disable('劃這天排休', '週六日自選 ' + d.limits.maxWeekend + ' 天已經選滿');

  btn.className = 'btn primary';
  btn.textContent = '劃這天排休';
  hint.textContent = day.unlimited ? '這個職務每天不限人數' : '剩 ' + (day.quota - day.used) + ' 個名額';
  btn.onclick = () => act('book', date);
}

/* ===== 劃假順序 ===== */
function renderTurn(d){
  const box = $('#turnBox'), tv = d.turn || {};
  box.textContent = '';
  if (!tv.active && !tv.submitted){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  if (tv.submitted){ box.className = 'turnbox done'; box.textContent = '你 ' + Number(d.month.slice(5)) + ' 月的排休已經送出' + (tv.submittedAt ? '（' + tv.submittedAt + '）' : '') + '，要修改請洽主管'; return; }
  if (tv.isMyTurn){ box.className = 'turnbox go'; box.textContent = '輪到你劃假了！自排、許願排好後，按最下面的「送出」換下一位'; }
  else { box.className = 'turnbox'; box.textContent = '目前輪到 ' + tv.turnName + ' 劃假，你在' + (tv.scope ? '「' + tv.scope + '」' : '') + '排第 ' + tv.myIndex + ' 位（共 ' + tv.total + ' 位）。輪到你之前可以先看名額；事假／病假／特休隨時可以申請'; }
  const ol = el('ol');
  (tv.list || []).forEach(p => ol.appendChild(el('li', (p.turn ? 'turn' : '') + (p.me ? ' me' : ''), p.name + (p.submitted ? '　✓ 已送出' : p.turn ? '　← 劃假中' : ''))));
  box.appendChild(ol);
}

/* ===== 送出 ===== */
function renderSubmit(d){
  const box = $('#submitBox'), tv = d.turn || {};
  const show = d.window.status === 'open' && !tv.submitted;
  box.classList.toggle('hidden', !show);
  if (!show) return;
  const needL = Math.max(0, d.limits.maxLeave - d.counts.leave), needW = Math.max(0, d.limits.maxMgr - (d.counts.wish || 0));
  const streaks = d.streaks || [];
  $('#streakBox').classList.toggle('hidden', !streaks.length);
  $('#streakBox').textContent = streaks.length ? '會連續上班 7 天以上：' + streaks.join('、') : '';
  const btn = $('#submitBtn'), hint = $('#submitHint');
  const notTurn = tv.active && !tv.isMyTurn;
  const ready = !needL && !needW && !notTurn;
  btn.className = 'btn ' + (ready ? 'primary' : 'off');
  btn.textContent = '送出 ' + Number(d.month.slice(5)) + ' 月排休';
  hint.textContent = notTurn ? '還沒輪到你' : (needL || needW) ? '還差' + [needL ? ' 自排 ' + needL + ' 天' : '', needW ? ' 許願 ' + needW + ' 天' : ''].join('') + '，排滿才能送出'
    : '送出後就不能再改' + (tv.active ? '，會換下一位劃假' : '');
}
function showAlert(title, msg){
  $('#alertTitle').textContent = title; $('#alertMsg').textContent = msg;
  $('#alertBox').classList.add('show');
}
$('#alertOk').addEventListener('click', () => $('#alertBox').classList.remove('show'));
$('#submitBtn').addEventListener('click', async () => {
  const d = state.data; if (!d || state.busy) return;
  const tv = d.turn || {};
  const needL = d.limits.maxLeave - d.counts.leave, needW = d.limits.maxMgr - (d.counts.wish || 0);
  if (tv.active && !tv.isMyTurn) return showAlert('還沒輪到你', '目前輪到 ' + tv.turnName + ' 劃假');
  if (needL > 0 || needW > 0) return showAlert('還沒排完', '還差' + [needL > 0 ? ' 自排 ' + needL + ' 天' : '', needW > 0 ? ' 許願 ' + needW + ' 天' : ''].join('') + '。排不滿的話請洽主管');
  if (!state.confirmSubmit){ state.confirmSubmit = true; $('#submitBtn').textContent = '確定送出？送出後就不能再改'; setTimeout(() => { state.confirmSubmit = false; if (state.data) renderSubmit(state.data); }, 4000); return; }
  state.confirmSubmit = false;
  setBusy(true);
  try {
    const data = await api('submit', { month: d.month });
    render(data); toast(data.message || '已送出');
  } catch(e){
    if (e.code === 'WORK_STREAK7') showAlert('不能送出：會連上 7 天', e.message);
    else if (e.code === 'NOT_DONE') showAlert('還沒排完', e.message);
    else handleError(e);
    if (state.token && e.code !== 'AUTH') load(false);
  } finally { setBusy(false); }
});

/* ===== 小工具 ===== */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
let toastTimer;
function toast(msg, err){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = err ? 'err' : ''; }, err ? 4000 : 2500);
}
function setBusy(b){ state.busy = b; $('#busy').classList.toggle('hidden', !b); }

$('#backdrop').addEventListener('click', closeSheet);
$('#logoutBtn').addEventListener('click', () => logout(''));
// 月曆／清單切換，記住同仁上次選的
try { state.view = localStorage.getItem('leaveView') || 'cal'; } catch(e){ state.view = 'cal'; }
document.querySelectorAll('#viewSw button').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.v; try { localStorage.setItem('leaveView', state.view); } catch(e){}
  if (state.data) renderList(state.data);
}));
$('#onlyMine').addEventListener('change', () => { if (state.data) renderList(state.data); });
</script>
